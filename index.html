<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./media/images/kaktus.png" />

    <title>El Pollo Loco</title>

    <link rel="stylesheet" href="style.css" />

    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/game-over-screen.class.js"></script>
    <script src="./models/game-win-screen.class.js"></script>
    <script src="./models/start-screen.class copy.js"></script>

    <script src="./models/movable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/coin-bar.class.js"></script>
    <script src="./models/bottle-bar.class.js"></script>
    <script src="./models/boss-bar.class.js"></script>

    <script src="./models/world.class.js"></script>

    <script src="./models/background-object.class.js"></script>
    <script src="./models/cloud.class.js"></script>

    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>

    <script src="./levels/level1.js"></script>
    <script src="./models/music.js"></script>

    <script src="./js/game.js"></script>
  </head>
  <body onload="initStart()">
    <h1>El Pollo Loco</h1>
    <div id="fullscreen">
      <div class="alignment">
        <canvas id="canvas" width="960" height="540"></canvas>
        <div id="startGameOverlay" class="startGameOverlay" onclick="init()">
          <p id="blinker">Press ENTER or DISPLAY to start</p>
        </div>
        <div id="restartGameOverlay" class="restartGameOverlay" onclick="init()">
          <p id="blinkerOver">Press R or DISPLAY to restart</p>
        </div>

        <div id="mobileButtons" class="mobileButtons">
          <div class="actionButtons">
            <button
              onmousedown="simulateKeyDown(70)"
              onmouseup="simulateKeyUp(70)"
              ontouchstart="simulateKeyDown(70)"
              ontouchend="simulateKeyUp(70)">
              <img src="./media/images/arrow/bottle.png" alt="bottle button" />
            </button>
            <button
              onmousedown="simulateKeyDown(32)"
              onmouseup="simulateKeyUp(32)"
              ontouchstart="simulateKeyDown(32)"
              ontouchend="simulateKeyUp(32)">
              <img src="./media/images/arrow/up.png" alt="" />
            </button>
          </div>
          <div class="moveButtons">
            <button
              onmousedown="simulateKeyDown(37)"
              onmouseup="simulateKeyUp(37)"
              ontouchstart="simulateKeyDown(37)"
              ontouchend="simulateKeyUp(37)">
              <img src="./media/images/arrow/left.png" alt="left button" />
            </button>
            <button
              onmousedown="simulateKeyDown(39)"
              onmouseup="simulateKeyUp(39)"
              ontouchstart="simulateKeyDown(39)"
              ontouchend="simulateKeyUp(39)">
              <img src="./media/images/arrow/right.png" alt="right button" />
            </button>
          </div>
        </div>
        <div id="landscapeOverlay" class="landscapeOverlay">
          <p>Turn device sideways for best gaming experience!</p>
        </div>
        <button id="soundMute" class="soundMenu" onclick="muteSound(), this.blur()">
          <img src="./media/images/soundMenu.png" alt="sound menu button" />
        </button>
        <button id="screenFull" class="screenFull" onclick="toggleFullscreen(), this.blur()">
          <img src="./media/images/full_screen.png" alt="fullscreen button" />
        </button>
      </div>
    </div>

    <div class="gameInstructions">
      <p>ENTER = Start game // R = Restart</p>
      <p>&#8678; , A = Walk left // &#8680; , D = Walk right</p>
      <p>SPACE = Jump // F = Throw bottle</p>
    </div>
    <button class="webNav">
      <a href="impressum.html">Impressum</a>
    </button>
  </body>
</html>
